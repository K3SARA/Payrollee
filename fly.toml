# fly.toml app configuration file generated for payrollee on 2026-10-22T08:17:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'payrollee'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5000'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
